name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Keep the oldest supported Python on a runner with a published 3.9 build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Run local demo
        run: python3 scripts/run_demo.py
